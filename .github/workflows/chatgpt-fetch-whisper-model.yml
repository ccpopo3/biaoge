name: ChatGPT Fetch Whisper Model

on:
  push:
    branches:
      - chatgpt-audio-transcribe-20260902
    paths:
      - '.github/workflows/chatgpt-fetch-whisper-model.yml'

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper model
        run: |
          curl -L --fail --retry 3 -o ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          sha256sum ggml-small-q5_1.bin
          ls -lh ggml-small-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: ggml-small-q5_1.bin
          retention-days: 1
